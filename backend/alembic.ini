# Alembic configuration for AgentForge (lives at backend/alembic.ini).
# Run from backend/:  alembic upgrade head
#
# The database URL comes from the DATABASE_URL env var (via app.config) —
# the sqlalchemy.url here is a fallback only.

[alembic]
script_location = alembic
prepend_sys_path = .
# Overridden by DATABASE_URL in alembic/env.py when set.
sqlalchemy.url = sqlite:///./agentforge.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
